name = "stencyl"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "stencyl"
database_id = "edca51d2-9f08-4833-bc0d-e3e4959ed1f8"
# Secrets (wrangler secret put): ADMIN_PASSWORD, RESEND_API_KEY, DISCORD_WEBHOOK_URL

# Optional image-host storage with bigger files (5 MB instead of ~1.3 MB in D1).
# Create the bucket first:  wrangler r2 bucket create stencyl-images   — then uncomment:
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "stencyl-images"
